# T380 kiosk exposes only a station interface through Android's Wi-Fi HAL.
# Prima has no dedicated P2P_DEVICE; initializing P2P on wlan0 makes vendor
# supplicant AIDL register it as a P2P object instead of a station object.
p2p_disabled=1

# Prima advertises ANY wake support. Keep the STA associated through cfg80211
# system suspend; validate real packet wake before retaining this in a release.
wowlan_triggers=any
